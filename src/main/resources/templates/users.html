<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CancunTravel · Viaja diferente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="site-header"><nav class="nav-wrap"><a class="brand" th:href="@{/welcome}"><span class="brand-icon">✳</span> cancun<span>travel</span></a><div class="nav-links"><a th:href="@{/welcome}">Inicio</a><a th:href="@{/trips}">Explorar viajes</a><a class="nav-cta" th:href="@{/}">Mi panel →</a></div></nav></header><main class="container-shell section"><a class="back-link" th:href="@{/}">← Mi panel</a><div class="section-heading"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1 class="page-title">Usuarios<span class="accent">.</span></h1><p>Gestiona las cuentas de CancunTravel.</p></div><a class="btn-main" th:href="@{/admin/users/new}">Crear usuario ↗</a></div><div class="notice" th:if="${message}" th:text="${message}"></div><div class="list-card" th:each="user : ${users}"><div><h3 th:text="${user.username}"></h3><p th:text="${user.role}"></p><span class="pill" th:text="${user.enabled ? 'ACTIVO' : 'INACTIVO'}"></span></div><form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post"><input type="hidden" name="enabled" th:value="${!user.enabled}"><button class="btn-outline" th:text="${user.enabled ? 'Desactivar' : 'Activar'}"></button></form></div></main><footer class="site-footer"><div class="container-shell footer-inner"><div><strong>cancuntravel ✳</strong><p>Historias que comienzan junto al mar.</p></div><div>Hecho para explorar · MVP académico<br><small>Reservas de demostración, sin pagos reales.</small></div></div></footer></body></html>
