<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizar viaje</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container-shell section narrow"><a class="back-link" th:href="@{/trips/{id}(id=${trip.id})}">← Volver al viaje</a><span class="eyebrow">ORGANIZACIÓN</span><h1 class="page-title" th:text="${trip.name}"></h1><div class="notice" th:if="${message}" th:text="${message}"></div><div class="error" th:if="${error}" th:text="${error}"></div><form class="form-card" th:action="@{/organization/{id}(id=${trip.id})}" method="post"><label>Guía asignado<select name="guideId"><option value="">Sin asignar</option><option th:each="guide : ${guides}" th:value="${guide.id}" th:text="${guide.username}" th:selected="${trip.guide != null and trip.guide.id == guide.id}"></option></select></label><label>Notas de organización<textarea name="notes" maxlength="1000" rows="5" th:text="${trip.organizationNotes}"></textarea></label><button class="btn-main">Guardar organización</button></form></main></body></html>
