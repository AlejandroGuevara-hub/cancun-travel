<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CancunTravel · Viaja diferente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="site-header"><nav class="nav-wrap"><a class="brand" th:href="@{/welcome}"><span class="brand-icon">✳</span> cancun<span>travel</span></a><div class="nav-links"><a th:href="@{/welcome}">Inicio</a><a th:href="@{/trips}">Explorar viajes</a><a class="nav-cta" th:href="@{/}">Mi panel →</a></div></nav></header><main class="container-shell section narrow"><a class="back-link" th:href="@{/budgets}">← Presupuestos</a><span class="eyebrow">NUEVA PROPUESTA</span><h1 class="page-title">Crear presupuesto<span class="accent">.</span></h1><form class="form-card" th:object="${budget}" th:action="@{/budgets}" method="post"><div class="error" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><label>Concepto<input th:field="*{concept}" required maxlength="200" placeholder="Ej. Transporte a cenotes"></label><label>Monto estimado en MXN<input type="number" th:field="*{amount}" min="0.01" step="0.01" required></label><button class="btn-main">Enviar para revisión ↗</button></form></main><footer class="site-footer"><div class="container-shell footer-inner"><div><strong>cancuntravel ✳</strong><p>Historias que comienzan junto al mar.</p></div><div>Hecho para explorar · MVP académico<br><small>Reservas de demostración, sin pagos reales.</small></div></div></footer></body></html>
